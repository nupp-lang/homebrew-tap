name: Test formula

on:
  workflow_dispatch:
  push:
    paths:
      - "Formula/nupp.rb"
      - ".github/workflows/test.yml"

permissions:
  contents: read

jobs:
  install:
    runs-on: macos-14
    steps:
      - name: Install Nupp from the public tap
        env:
          HOMEBREW_NO_AUTO_UPDATE: 1
        run: |
          set -euo pipefail
          brew tap nupp-lang/tap
          brew install nupp-lang/tap/nupp
          brew test nupp
          nupp --help
